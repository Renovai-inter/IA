[project]
name = "ia"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.3.5",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=0.3.0",
    "langgraph>=1.2.11",
    "markdown>=3.11",
    "psycopg>=3.3.5",
    "psycopg-pool>=3.3.1",
    "psycopg2>=2.9.12",
    "pymongo>=4.18.1",
    "qdrant-client>=1.19.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Inclui "smoke_test_*.py" além do padrão (test_*.py / *_test.py) porque
# tests/integration/smoke_test_ollama_provider.py não bate com nenhum dos
# dois — sem isso o pytest simplesmente não coletava esse arquivo (sem erro,
# sem aviso, os 3 testes de lá nunca rodavam).
python_files = ["test_*.py", "*_test.py", "smoke_test_*.py"]
markers = [
    "requires_ollama: precisa de um servidor Ollama local respondendo (ver tests/integration/ollama_helpers.py)",
]
