[project]
name = "ia"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.16",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.3.5",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=0.3.0",
    "langgraph>=1.2.11",
    "psycopg>=3.3.5",
    "psycopg-pool>=3.3.1",
    "psycopg2>=2.9.12",
    "pymongo>=4.18.1",
    "qdrant-client>=1.19.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "requires_ollama: precisa de um servidor Ollama local respondendo (ver tests/integration/ollama_helpers.py)",
]