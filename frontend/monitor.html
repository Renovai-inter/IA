<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Renovaí IA — Console de Observabilidade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f8f5;
      color-scheme: light;
      --panel: #ffffff;
      --panel-alt: #f3e9ed;
      --border: #e2e5dc;
      --text: #171717;
      --muted: #6b7280;
      --faint: #626975;
      --accent: #582136;
      --accent-soft: #f3e9ed;
      --brand-green: #d4e699;
      --brand-green-soft: #f1f6e3;
      --brand-green-text: #35451d;
      --ok: #237044;
      --ok-soft: #edf7ef;
      --erro: #b42318;
      --erro-soft: #fef3f2;
      --warn: #8a5800;
      --warn-soft: #fff7e5;
      --font-sans: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }
    .pagina { max-width: 1440px; margin: 0 auto; padding: 32px 40px 64px; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px; margin-bottom: 32px;
      padding: 24px 0 28px; border-bottom: 1px solid var(--border); color: var(--text);
    }
    .marca { display: flex; align-items: center; gap: 24px; }
    .ponto {
      width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex-shrink: 0;
    }
    .ponto.ok { background: var(--ok); }
    .ponto.erro { background: var(--erro); }
    h1 { font-size: clamp(1.25rem, 3vw, 1.75rem); font-weight: 600; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
    .logo { display: block; width: 156px; height: auto; flex-shrink: 0; }
    .titulo { padding-left: 24px; border-left: 1px solid var(--border); }
    .conexao { display: flex; align-items: center; gap: 8px; }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: 0.875rem; line-height: 1.5; }
    .acoes { display: flex; align-items: center; flex-shrink: 0; gap: 24px; }
    button {
      font-family: var(--font-sans); font-size: 0.875rem; font-weight: 600;
      color: #ffffff; background: var(--accent);
      border: 1px solid transparent; border-radius: 6px; min-height: 44px;
      padding: 12px 20px; line-height: 1.5; white-space: nowrap; cursor: pointer; transition: background-color 0.2s;
    }
    button:hover:not(:disabled) { background: #702c46; }
    button:active:not(:disabled) { background: #421829; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    button:disabled { opacity: 0.6; cursor: default; }
    ::selection { color: #ffffff; background: var(--accent); }
    * { scrollbar-color: #b7a3ab var(--panel-alt); scrollbar-width: thin; }
    .slo {
      border: 1px solid var(--border); border-radius: 14px;
      padding: 20px 24px; margin-bottom: 28px; background: var(--panel);
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
    }
    .slo.ok { border-color: #c1d383; background: var(--brand-green-soft); color: var(--brand-green-text); }
    .slo.estourou { border-color: #efc0bb; background: var(--erro-soft); color: var(--erro); }
    .slo strong { font-size: 1.125rem; font-weight: 600; }
    .slo p { margin: 6px 0 0; color: var(--muted); font-size: 0.875rem; line-height: 1.5; }
    .slo.ok p, .slo.estourou p { color: inherit; }
    .faixa { margin: 32px 0 14px; font-size: 1.125rem; font-weight: 600; color: var(--accent); }
    .numeros { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px;
    }
    .card { min-width: 0; }
    #numeros-sre .card .valor { color: var(--accent); }
    #numeros-sre .card:nth-child(4) { background: var(--accent); border-color: var(--accent); }
    #numeros-sre .card:nth-child(4) .rotulo { color: #ead9e0; }
    #numeros-sre .card:nth-child(4) .valor { color: var(--brand-green); }
    #numeros-ia { gap: 0; background: var(--brand-green-soft); border: 1px solid #d6e1ba; border-radius: 10px; overflow: hidden; }
    #numeros-ia .card { background: transparent; border: 0; border-radius: 0; }
    #numeros-ia .rotulo, #numeros-ia .nota { color: var(--brand-green-text); }
    #numeros-ia .valor { color: var(--accent); }
    .card .rotulo { color: var(--muted); font-size: 0.8125rem; font-weight: 500; line-height: 1.5; }
    .card .valor { margin-top: 10px; font-size: 1.75rem; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .card .valor.pequeno { font-size: 1rem; white-space: normal; overflow-wrap: anywhere; }
    .card .nota { margin-top: 8px; color: var(--faint); font-size: 0.75rem; line-height: 1.5; }
    .graficos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 28px; }
    .grafico { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px 24px 16px; min-width: 0; }
    .grafico h2 { margin: 0 0 16px; font-size: 1rem; font-weight: 600; color: var(--accent); }
    canvas { width: 100%; height: 220px; display: block; }
    .tabela-larga { margin-top: 24px; }
    .bloco { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: auto; }
    .bloco h2 { margin: 0; padding: 20px 24px; font-size: 1rem; font-weight: 600; color: var(--accent); background: var(--panel); border-bottom: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th, td { padding: 16px 24px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.02em; text-transform: uppercase; font-weight: 700; background: var(--panel); }
    td { color: var(--text); font-variant-numeric: tabular-nums; }
    td.modelo, td.sessao { font-size: 0.8125rem; }
    td.msg { font-size: 0.8125rem; white-space: pre-wrap; word-break: break-all; }
    .tag { display: inline-block; font-size: 0.6875rem; font-weight: 600; line-height: 1.5; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; }
    .tag.ok { color: var(--ok); background: var(--ok-soft); }
    .tag.erro { color: var(--erro); background: var(--erro-soft); }
    .tag.bloqueado { color: var(--warn); background: var(--warn-soft); }
    .tag.debug { color: var(--muted); background: var(--panel-alt); }
    .tag.info { color: var(--accent); background: var(--accent-soft); }
    .tag.warning { color: var(--warn); background: var(--warn-soft); }
    .aviso { margin: 16px 0; padding: 16px 20px; border: 1px solid #efc0bb; border-radius: 10px; background: var(--erro-soft); color: var(--erro); font-size: 0.875rem; }
    .vazio { color: var(--faint); margin: 0; padding: 24px; font-size: 0.875rem; line-height: 1.5; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #faf7f8; }
    @media (max-width: 800px) {
      .graficos { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: stretch; padding: 8px 0 24px; gap: 20px; }
      .numeros { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .acoes { justify-content: space-between; flex-wrap: wrap; }
      .pagina { padding: 24px 16px 40px; }
    }
    @media (max-width: 480px) {
      .marca { align-items: flex-start; flex-direction: column; gap: 20px; }
      .titulo { border-left: 0; padding-left: 0; }
      .logo { width: 136px; }
      .numeros { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .card { padding: 16px 12px; }
      .card .valor { font-size: 1.25rem; }
      .card .valor.pequeno { font-size: 0.875rem; }
      .grafico { padding: 20px 12px 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <div class="pagina">
    <header>
      <div>
        <div class="marca">
          <img class="logo" src="assets/renovai.png" alt="Renovaí" width="283" height="77" />
          <div class="titulo">
            <h1>Observabilidade</h1>
            <p class="sub">Desempenho e consumo do chatbot</p>
          </div>
        </div>
      </div>
      <div class="acoes">
        <div class="conexao"><span class="ponto" id="ponto" aria-hidden="true"></span><span class="sub" id="atualizado" role="status">Conectando à API…</span></div>
        <button type="button" id="atualizar">Atualizar agora</button>
      </div>
    </header>

    <p class="aviso" id="aviso" role="alert" hidden></p>

    <section class="slo" id="slo">
      <div>
        <strong id="slo-titulo">SLO</strong>
        <p id="slo-texto">p95 de latência e taxa de erro desta execução.</p>
      </div>
    </section>

    <h2 class="faixa">Serviço (SRE)</h2>
    <section class="numeros" id="numeros-sre"></section>

    <h2 class="faixa">Inteligência artificial (LLMs)</h2>
    <section class="numeros" id="numeros-ia"></section>

    <section class="graficos">
      <article class="grafico">
        <h2>Latência por turno (limite 8s)</h2>
        <canvas id="grafico-latencia"></canvas>
      </article>
      <article class="grafico">
        <h2>Custo acumulado (USD)</h2>
        <canvas id="grafico-custo"></canvas>
      </article>
    </section>

    <article class="bloco tabela-larga">
      <h2>Turnos</h2>
      <div id="tabela-turnos"></div>
    </article>

    <article class="bloco tabela-larga">
      <h2>Por modelo</h2>
      <div id="tabela-modelo"></div>
    </article>

    <article class="bloco tabela-larga">
      <h2>Por rota</h2>
      <div id="tabela-rota"></div>
    </article>

    <article class="bloco tabela-larga">
      <h2>Logs e debugs unificados</h2>
      <div id="tabela-logs"></div>
    </article>


  </div>

  <script>
    const numerosSre = document.getElementById("numeros-sre");
    const numerosIa = document.getElementById("numeros-ia");
    const aviso = document.getElementById("aviso");
    const ponto = document.getElementById("ponto");
    const atualizado = document.getElementById("atualizado");

    function ms(valor) {
      if (valor >= 1000) {
        return (valor / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " s";
      }
      return Math.round(valor).toLocaleString("pt-BR") + " ms";
    }

    function usd(valor) {
      return valor.toLocaleString("pt-BR", { style: "currency", currency: "USD", minimumFractionDigits: 4, maximumFractionDigits: 6 });
    }

    function inteiro(valor) {
      return Number(valor || 0).toLocaleString("pt-BR");
    }

    function pct(valor) {
      return (valor * 100).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
    }

    function duracao(segundos) {
      const minutos = Math.floor(segundos / 60);
      const resto = segundos % 60;
      if (minutos <= 0) return resto + "s";
      return minutos + "min " + resto + "s";
    }

    function card(rotulo, valor, nota, pequeno) {
      return `<article class="card"><div class="rotulo">${rotulo}</div><div class="valor${pequeno ? " pequeno" : ""}">${valor}</div>${nota ? `<div class="nota">${nota}</div>` : ""}</article>`;
    }

    function tabela(colunas, linhas, vazio) {
      if (!linhas.length) return `<p class="vazio">${vazio}</p>`;
      const cabeca = colunas.map((c) => `<th>${c}</th>`).join("");
      const corpo = linhas.map((linha) => `<tr>${linha.map((celula) => `<td class="${celula.classe || ""}">${celula.texto}</td>`).join("")}</tr>`).join("");
      return `<table><thead><tr>${cabeca}</tr></thead><tbody>${corpo}</tbody></table>`;
    }

    function tagStatus(status) {
      const s = String(status).toLowerCase();
      return `<span class="tag ${s}">${status}</span>`;
    }

    function desenharLinha(canvas, pontos, cor, limite) {
      const ctx = canvas.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      const largura = canvas.clientWidth || 320;
      const altura = canvas.clientHeight || 180;
      canvas.width = Math.floor(largura * dpr);
      canvas.height = Math.floor(altura * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, largura, altura);

      if (!pontos.length) {
        ctx.fillStyle = "#626975";
        ctx.font = "13px Inter, sans-serif";
        ctx.fillText("Sem turnos ainda", 12, altura / 2);
        return;
      }

      const valores = pontos.map((p) => p.valor);
      let min = Math.min(...valores, 0);
      let max = Math.max(...valores);
      if (limite != null) max = Math.max(max, limite);
      const folga = Math.max((max - min) * 0.08, max * 0.05);
      max = max + folga;
      if (max === min) max = min + 1;
      const span = max - min || 1;
      const pad = { l: 48, r: 12, t: 14, b: 26 };
      const xDe = (i) => pad.l + (pontos.length === 1 ? (largura - pad.l - pad.r) / 2 : (i / (pontos.length - 1)) * (largura - pad.l - pad.r));
      const yDe = (v) => pad.t + (1 - (v - min) / span) * (altura - pad.t - pad.b);

      ctx.strokeStyle = "#d8c7ce";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad.l, pad.t);
      ctx.lineTo(pad.l, altura - pad.b);
      ctx.lineTo(largura - pad.r, altura - pad.b);
      ctx.stroke();

      ctx.fillStyle = "#626975";
      ctx.font = "11px Inter, sans-serif";
      ctx.fillText(String(Math.round(max)), 4, pad.t + 4);
      ctx.fillText(String(Math.round(min)), 4, altura - pad.b);

      if (limite != null) {
        const y = yDe(limite);
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = "#b42318";
        ctx.beginPath();
        ctx.moveTo(pad.l, y);
        ctx.lineTo(largura - pad.r, y);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.beginPath();
      pontos.forEach((pontoAtual, i) => {
        const x = xDe(i);
        const y = yDe(pontoAtual.valor);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = cor;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = cor;
      pontos.forEach((pontoAtual, i) => {
        ctx.beginPath();
        ctx.arc(xDe(i), yDe(pontoAtual.valor), 3, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function render(dados) {
      const r = dados.resumo;
      const slo = dados.slo;
      const caixa = document.getElementById("slo");
      caixa.classList.remove("ok", "estourou");
      if (!r.turnos) {
        document.getElementById("slo-titulo").textContent = "Sem turnos";
        document.getElementById("slo-texto").textContent = "Mande uma mensagem no chat. O registro vive na memória deste processo.";
      } else if (r.slo_ok) {
        caixa.classList.add("ok");
        document.getElementById("slo-titulo").textContent = "Dentro do SLO";
        document.getElementById("slo-texto").textContent = `P95 até ${ms(slo.latencia_p95_limite_ms)} e erro até ${pct(slo.taxa_erro_limite)}.`;
      } else {
        caixa.classList.add("estourou");
        document.getElementById("slo-titulo").textContent = "SLO estourou";
        document.getElementById("slo-texto").textContent = `P95 até ${ms(slo.latencia_p95_limite_ms)} e erro até ${pct(slo.taxa_erro_limite)}.`;
      }

      numerosSre.innerHTML = [
        card("Turnos", inteiro(r.turnos)),
        card("Taxa de erro", pct(r.taxa_erro), "Exceção no turno"),
        card("Latência média", ms(r.latencia_media_ms)),
        card("Latência P95", ms(r.latencia_p95_ms)),
        card("No ar", duracao(r.no_ar_segundos)),
        card("Em andamento", inteiro(r.em_andamento)),
        card("Bloqueios", inteiro(r.bloqueios), "Guardrail de entrada"),
      ].join("");

      numerosIa.innerHTML = [
        card("Tokens", inteiro(r.tokens_total), `${inteiro(r.tokens_entrada)} entrada · ${inteiro(r.tokens_saida)} saída`),
        card("Custo", usd(r.custo_usd), "Tabela fixa, não é a fatura"),
        card("Modelo mais usado", r.modelo_mais_usado, "", true),
        card("Fallbacks", inteiro(r.fallbacks), "Especialista saiu do Gemini"),
      ].join("");

      desenharLinha(
        document.getElementById("grafico-latencia"),
        dados.serie_latencia.map((p) => ({ valor: p.latencia_ms })),
        "#582136",
        slo.latencia_p95_limite_ms,
      );
      desenharLinha(
        document.getElementById("grafico-custo"),
        dados.serie_custo.map((p) => ({ valor: p.custo_acumulado_usd })),
        "#526d29",
        null,
      );

      document.getElementById("tabela-turnos").innerHTML = tabela(
        ["Hora", "Latência", "Rota", "Status", "Tokens", "Custo", "Sessão"],
        dados.turnos.map((t) => [
          { texto: t.hora },
          { texto: ms(t.latencia_ms) },
          { texto: t.rota },
          { texto: tagStatus(t.status) },
          { texto: inteiro(t.tokens_total) },
          { texto: usd(t.custo_usd) },
          { texto: t.session_id, classe: "sessao" },
        ]),
        "Nenhum turno neste processo.",
      );

      document.getElementById("tabela-modelo").innerHTML = tabela(
        ["Modelo", "Chamadas", "Entrada", "Saída", "Custo", "Latência"],
        dados.por_modelo.map((m) => [
          { texto: m.modelo, classe: "modelo" },
          { texto: inteiro(m.chamadas) },
          { texto: inteiro(m.tokens_entrada) },
          { texto: inteiro(m.tokens_saida) },
          { texto: usd(m.custo_usd) },
          { texto: ms(m.latencia_media_ms) },
        ]),
        "Nenhuma chamada de modelo.",
      );

      document.getElementById("tabela-rota").innerHTML = tabela(
        ["Rota", "Turnos", "Erros", "Latência", "Custo"],
        dados.por_rota.map((rota) => [
          { texto: rota.rota },
          { texto: inteiro(rota.turnos) },
          { texto: inteiro(rota.erros) },
          { texto: ms(rota.latencia_media_ms) },
          { texto: usd(rota.custo_usd) },
        ]),
        "Nenhuma rota ainda.",
      );

      if (dados.logs) {
        document.getElementById("tabela-logs").innerHTML = tabela(
          ["Hora", "Nível", "Módulo", "Turno", "Mensagem"],
          dados.logs.slice().reverse().map((l) => [
            { texto: l.hora },
            { texto: tagStatus(l.nivel) },
            { texto: l.modulo },
            { texto: l.turno_id ? l.turno_id.slice(0, 8) : "—", classe: "sessao" },
            { texto: l.mensagem, classe: "msg" },
          ]),
          "Nenhum log registrado ainda.",
        );
      }
    }

    async function carregar() {
      try {
        const resposta = await fetch("/monitor");
        if (!resposta.ok) throw new Error("HTTP " + resposta.status);
        const dados = await resposta.json();
        aviso.hidden = true;
        ponto.className = "ponto ok";
        atualizado.textContent = "Atualizado " + new Date().toLocaleTimeString("pt-BR") + " · a cada 4 s";
        render(dados);
      } catch (erro) {
        ponto.className = "ponto erro";
        atualizado.textContent = "Sem conexão com a API";
        aviso.hidden = false;
        aviso.textContent = "Não consegui ler /monitor. A API está no ar? " + erro.message;
      }
    }

    document.getElementById("atualizar").addEventListener("click", carregar);
    carregar();
    setInterval(carregar, 4000);
    window.addEventListener("resize", carregar);
  </script>
</body>
</html>
