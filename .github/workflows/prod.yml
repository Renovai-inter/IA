name: PROD

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy-prod:
    name: Deploy to PROD
    if: github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ vars.PROD_URL || 'https://prod.example.com' }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        env:
          PROD_WEBHOOK_URL: ${{ secrets.PROD_DEPLOY_WEBHOOK_URL }}
          PROD_DEPLOY_TOKEN: ${{ secrets.PROD_DEPLOY_TOKEN }}
        shell: bash
        run: |
          if [ -n "${PROD_WEBHOOK_URL}" ]; then
            echo "Deploying commit ${GITHUB_SHA} to production"
            curl -fsS -X POST "${PROD_WEBHOOK_URL}" \
              -H "Authorization: Bearer ${PROD_DEPLOY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"status":"success","environment":"prod","ref":"'"${GITHUB_SHA}"'"}'
          else
            echo "Production webhook not configured. Skipping deploy."
          fi
