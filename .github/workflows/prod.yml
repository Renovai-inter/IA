name: Deploy to AWS EKS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aws-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'renovai-api-ia' }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PostgreSQL build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libpq-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.9.0'

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Validate and test
        run: |
          uv run --frozen --no-dev python -m compileall app
          uv run --frozen --no-dev python -m unittest discover -s tests -v

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read EKS version
        id: cluster
        run: |
          VERSION=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query 'cluster.version' --output text)
          echo "kubectl-version=v${VERSION}.0" >> "$GITHUB_OUTPUT"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ steps.cluster.outputs.kubectl-version }}

      - name: Build, push to ECR and deploy to EKS
        run: bash orchestration/deploy.sh
