name: Build

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate syntax
        run: uv run python -m compileall main.py app

      - name: Run tests if present
        shell: bash
        run: |
          if [ -n "$(find . -type d \( -name .venv -o -name .git \) -prune -o -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit)" ]; then
            uv run --with pytest python -m pytest -q --ignore=.venv
          else
            echo "No Python tests found. Skipping pytest."
          fi
